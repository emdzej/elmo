name: Release

# Publish all packages to npm when a GitHub Release is published.
# Uses npm trusted publishing (OIDC) — configure each package's trusted
# publisher on npmjs.com to point at this workflow; no NPM_TOKEN needed.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # pnpm rewrites workspace:* deps to real versions and publishes each package
      - run: pnpm -r publish --access public --no-git-checks --provenance
