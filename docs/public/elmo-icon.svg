<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="elmo">
  <!-- electronics nod: little IC-style legs -->
  <g stroke="#9c2a20" stroke-width="3" stroke-linecap="round">
    <line x1="24" y1="52" x2="24" y2="61"/>
    <line x1="40" y1="52" x2="40" y2="61"/>
  </g>
  <!-- furry red head: a bumpy ring of tufts around a core -->
  <g fill="#e23b2e">
    <circle cx="55" cy="33" r="6"/><circle cx="52" cy="45" r="6"/><circle cx="44" cy="53" r="6"/>
    <circle cx="32" cy="56" r="6"/><circle cx="20" cy="53" r="6"/><circle cx="12" cy="45" r="6"/>
    <circle cx="9" cy="33" r="6"/><circle cx="12" cy="21" r="6"/><circle cx="20" cy="13" r="6"/>
    <circle cx="32" cy="10" r="6"/><circle cx="44" cy="13" r="6"/><circle cx="52" cy="21" r="6"/>
    <circle cx="32" cy="33" r="23"/>
  </g>
  <!-- big close-set eyes -->
  <g>
    <circle cx="25" cy="28" r="9" fill="#fff"/>
    <circle cx="39" cy="28" r="9" fill="#fff"/>
    <circle cx="26" cy="29" r="3.6" fill="#1c1c1c"/>
    <circle cx="38" cy="29" r="3.6" fill="#1c1c1c"/>
  </g>
  <!-- orange nose -->
  <ellipse cx="32" cy="39" rx="6" ry="5.2" fill="#f5821f"/>
  <!-- smile -->
  <path d="M23 44 Q32 52 41 44" fill="none" stroke="#9c2a20" stroke-width="2.4" stroke-linecap="round"/>
</svg>
