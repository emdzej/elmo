-baseline="middle">47k</text></g><g class="elmo-part"><g transform="matrix(1 0 0 1 273.8 90)"><line class="elmo-pin" x1="-14" y1="19" x2="30" y2="19"/><line class="elmo-pin" x1="40" y1="19" x2="84" y2="19"/><line class="elmo-sym" x1="31" y1="10" x2="31" y2="28"/><line class="elmo-sym" x1="39" y1="10" x2="39" y2="28"/></g><text class="elmo-ref" x="308.8" y="72" text-anchor="middle" dominant-baseline="middle">C1</text><text class="elmo-value" x="308.8" y="84" text-anchor="middle" dominant-baseline="middle">10n</text></g><line class="elmo-net" x1="125.85" y1="129.15" x2="125.85" y2="121.15"/><line class="elmo-net" x1="134.85" y1="121.15" x2="116.85" y2="121.15"/><text class="elmo-powerlabel" x="125.85" y="114.15" text-anchor="middle" dominant-baseline="middle">VCC</text><line class="elmo-net" x1="189.6" y1="215.15" x2="197.6" y2="215.15"/><line class="elmo-net" x1="197.6" y1="224.15" x2="197.6" y2="206.15"/><text class="elmo-powerlabel" x="204.6" y="215.15" text-anchor="start" dominant-baseline="middle">VCC</text><line class="elmo-net" x1="259.8" y1="31" x2="251.8" y2="31"/><line class="elmo-net" x1="251.8" y1="22" x2="251.8" y2="40"/><text class="elmo-powerlabel" x="244.8" y="31" text-anchor="end" dominant-baseline="middle">VCC</text><line class="elmo-net" x1="125.85" y1="265.15" x2="125.85" y2="271.15"/><line class="elmo-net" x1="117.85" y1="271.15" x2="133.85" y2="271.15"/><line class="elmo-net" x1="120.85" y1="275.15" x2="130.85" y2="275.15"/><line class="elmo-net" x1="123.85" y1="279.15" x2="127.85" y2="279.15"/><line class="elmo-net" x1="357.8" y1="109" x2="363.8" y2="109"/><line class="elmo-net" x1="363.8" y1="117" x2="363.8" y2="101"/><line class="elmo-net" x1="367.8" y1="114" x2="367.8" y2="104"/><line class="elmo-net" x1="371.8" y1="111" x2="371.8" y2="107"/><circle class="elmo-junction" cx="22" cy="224.2" r="2.6"/><circle class="elmo-junction" cx="12" cy="197.2" r="2.6"/></g></svg>