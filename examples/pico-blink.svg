<svg xmlns="http://www.w3.org/2000/svg" class="elmo" viewBox="0 0 697.1 520.95" width="697.1" height="520.95" font-family="sans-serif"><style>.elmo{--elmo-fg:#1c1c1c;--elmo-bg:#ffffff;--elmo-accent:#b23b2e;--elmo-muted:#666;--elmo-tag:#f3f3f3;}
@media (prefers-color-scheme: dark){.elmo{--elmo-fg:#e6e6e6;--elmo-bg:#1e1e1e;--elmo-accent:#ff7a6e;--elmo-muted:#9a9a9a;--elmo-tag:#2a2a2a;}}
:root[data-theme="dark"] .elmo{--elmo-fg:#e6e6e6;--elmo-bg:#1e1e1e;--elmo-accent:#ff7a6e;--elmo-muted:#9a9a9a;--elmo-tag:#2a2a2a;}
:root[data-theme="light"] .elmo{--elmo-fg:#1c1c1c;--elmo-bg:#ffffff;--elmo-accent:#b23b2e;--elmo-muted:#666;--elmo-tag:#f3f3f3;}
.elmo.elmo-theme-light{--elmo-fg:#1c1c1c;--elmo-bg:#ffffff;--elmo-accent:#b23b2e;--elmo-muted:#666;--elmo-tag:#f3f3f3;}
.elmo.elmo-theme-dark{--elmo-fg:#e6e6e6;--elmo-bg:#1e1e1e;--elmo-accent:#ff7a6e;--elmo-muted:#9a9a9a;--elmo-tag:#2a2a2a;}
.elmo.elmo-theme-mono{--elmo-fg:#111;--elmo-bg:#fff;--elmo-accent:#111;--elmo-muted:#555;--elmo-tag:#fff;}
.elmo .elmo-body{fill:var(--elmo-bg);stroke:var(--elmo-fg);stroke-width:1.5;}
.elmo .elmo-pin,.elmo .elmo-net,.elmo .elmo-wire{stroke:var(--elmo-fg);stroke-width:1.2;fill:none;}
.elmo .elmo-sym{stroke:var(--elmo-fg);stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-linecap:round;}
.elmo .elmo-sym-fill{stroke:var(--elmo-fg);stroke-width:1;fill:var(--elmo-fg);}
.elmo .elmo-symtext{fill:var(--elmo-fg);font:600 10px ui-sans-serif,system-ui,sans-serif;dominant-baseline:middle;}
.elmo .elmo-dash{stroke:var(--elmo-muted);stroke-width:1;stroke-dasharray:2 2;}
.elmo .elmo-ref{fill:var(--elmo-fg);font:700 12px ui-sans-serif,system-ui,sans-serif;}
.elmo .elmo-value{fill:var(--elmo-muted);font:400 10px ui-sans-serif,system-ui,sans-serif;}
.elmo .elmo-pinname{fill:var(--elmo-fg);font:400 10px ui-monospace,monospace;}
.elmo .elmo-pinnum{fill:var(--elmo-muted);font:400 8px ui-monospace,monospace;}
.elmo .elmo-powerlabel,.elmo .elmo-gndlabel,.elmo .elmo-signallabel{fill:var(--elmo-accent);font:600 9px ui-monospace,monospace;}
.elmo .elmo-signal{fill:var(--elmo-bg);stroke:var(--elmo-accent);stroke-width:1.5;}
.elmo .elmo-taglabel{fill:var(--elmo-tag);stroke:var(--elmo-accent);stroke-width:1;}
.elmo .elmo-nettext{fill:var(--elmo-accent);font:600 9px ui-monospace,monospace;}
.elmo .elmo-title{fill:var(--elmo-fg);font:700 15px ui-sans-serif,system-ui,sans-serif;}
.elmo .elmo-junction{fill:var(--elmo-fg);stroke:none;}
.elmo .elmo-group{fill:none;stroke:var(--elmo-muted);stroke-width:1;stroke-dasharray:5 4;}
.elmo .elmo-grouplabel{fill:var(--elmo-muted);font:600 11px ui-sans-serif,system-ui,sans-serif;}
.elmo a text{fill:var(--elmo-accent);text-decoration:underline;cursor:pointer;}
.elmo text{paint-order:stroke;stroke:var(--elmo-bg);stroke-width:3px;stroke-linejoin:round;}</style><rect x="0" y="0" width="697.1" height="520.95" fill="var(--elmo-bg)"/><text class="elmo-title" x="56" y="20" text-anchor="start" dominant-baseline="middle">Pi Pico blink</text><g transform="translate(56 86)"><polyline class="elmo-wire" fill="none" points="42,273.38 12,273.38 12,348 270.7,348"/><polyline class="elmo-wire" fill="none" points="368.9,348 438.9,348"/><g class="elmo-part"><g transform="matrix(1 0 0 1 56.1 164)"><rect class="elmo-body" x="0" y="0" width="130.5" height="164" rx="3"/></g><text class="elmo-ref" x="56.1" y="156" text-anchor="start" dominant-baseline="middle">U1</text><text class="elmo-value" x="77.1" y="156" text-anchor="start" dominant-baseline="middle">Raspberry Pi Pico</text><line class="elmo-pin" x1="56.1" y1="191.33" x2="42.1" y2="191.33"/><text class="elmo-pinname" x="61.1" y="191.33" text-anchor="start" dominant-baseline="middle">GP0</text><text class="elmo-pinnum" x="45.1" y="185.33" text-anchor="end" dominant-baseline="middle">1</text><line class="elmo-pin" x1="56.1" y1="218.67" x2="42.1" y2="218.67"/><text class="elmo-pinname" x="61.1" y="218.67" text-anchor="start" dominant-baseline="middle">GP1</text><text class="elmo-pinnum" x="45.1" y="212.67" text-anchor="end" dominant-baseline="middle">2</text><line class="elmo-pin" x1="56.1" y1="246" x2="42.1" y2="246"/><text class="elmo-pinname" x="61.1" y="246" text-anchor="start" dominant-baseline="middle">GND</text><text class="elmo-pinnum" x="45.1" y="240" text-anchor="end" dominant-baseline="middle">3</text><line class="elmo-pin" x1="56.1" y1="273.33" x2="42.1" y2="273.33"/><text class="elmo-pinname" x="61.1" y="273.33" text-anchor="start" dominant-baseline="middle">GP2</text><text class="elmo-pinnum" x="45.1" y="267.33" text-anchor="end" dominant-baseline="middle">4</text><line class="elmo-pin" x1="56.1" y1="300.67" x2="42.1" y2="300.67"/><text class="elmo-pinname" x="61.1" y="300.67" te